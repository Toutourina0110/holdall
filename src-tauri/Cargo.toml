[package]
name = "holdall"
version = "0.2.0"
description = "Holdall desktop app"
authors = ["Toutourina0110"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "holdall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
getrandom = "0.4"
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = "2.14.1"
