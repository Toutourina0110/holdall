<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holdall</title>
<style>
  :root { color-scheme: light dark; --ground: #f2f5f7; --ink: #14202a; --muted: #55616b; --line: #d5dde3; --surface: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0e141a; --ink: #e6ecf1; --muted: #93a1ad; --line: #24313d; --surface: #131b23; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font-family: "IBM Plex Sans", "Segoe UI", sans-serif; }
  main { max-width: 34rem; margin: 24px; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>Holdall desktop is not packaged yet</h1>
  <p>The bundled server arrives in phase 3. For now, run Holdall with pnpm dev and open it in a browser, or use pnpm desktop:dev.</p>
</main>
</body>
</html>
